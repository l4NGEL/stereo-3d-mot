name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-native:
    name: build + test (ubuntu-22.04)
    runs-on: ubuntu-22.04
    env:
      ORT_VERSION: 1.19.2
      ONNXRUNTIME_ROOT: /opt/onnxruntime
      LD_LIBRARY_PATH: /opt/onnxruntime/lib
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libopencv-dev libeigen3-dev libgtest-dev

      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo mkdir -p /opt/onnxruntime
          sudo tar -xzf ort.tgz -C /opt/onnxruntime --strip-components=1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DS3M_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  docker:
    name: docker image (baked build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t stereo-3d-mot:ci .
      - name: Run tests inside the image
        run: docker run --rm stereo-3d-mot:ci ctest --test-dir /workspace/build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: >
          find include src apps tests -type f \( -name '*.hpp' -o -name '*.cpp' \)
          -print0 | xargs -0 clang-format --dry-run --Werror
