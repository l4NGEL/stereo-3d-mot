%YAML:1.0
# Same as configs/kitti.yaml, plus Phase 6's tiled stereo matcher
# (num_tiles: 4). Kept as a SEPARATE file rather than changing kitti.yaml's
# default: kitti.yaml's numbers are already published (README/roadmap), and
# tiling is a near-exact but not bit-exact match to the untiled disparity
# (see docs/roadmap.md Phase 6 for the measured accuracy delta -- negligible
# on the synthetic ground-truth benchmark, but MOT metrics can be sensitive
# enough near decision boundaries that "negligible" shouldn't be assumed
# equal to "identical" without saying so). Use this file to reproduce the
# Phase 6 speed numbers; use kitti.yaml for the Phase 4/5 numbers as published.
stereo_matcher:
  type: "SGBM"
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  p1_multiplier: 8
  p2_multiplier: 32
  mode_hh: 0
  # Sweet spot measured on KITTI's ~375-row images (docs/roadmap.md Phase 6):
  # 2.12x faster than num_tiles=1 at this tile count; num_tiles=8 is barely
  # faster and num_tiles=16 is net SLOWER, because a fixed overlap margin
  # competes directly with tile height once tiles get thin -- more tiles is
  # not free parallelism past this point on an image this short.
  num_tiles: 4

depth_eval:
  min_depth: 0.1
  max_depth: 100.0
  bad_thresholds: [1.0, 2.0, 4.0]

detector:
  type: "onnx"
  model_path: "models/yolov8n.onnx"
  score_threshold: 0.25
  nms_iou: 0.45
  input_size: 640
  keep_classes: [0, 1, 2, 3, 5, 7]

tracking:
  dt: 0.1
  process_noise: 1.0
  measurement_noise: 1.0
  max_age: 30
  min_hits: 3
  gating_distance: 2.0
  association: "mahalanobis3d"
  gating_chi2: 7.815
  iou_gate: 0.3
  use_hungarian: 1
  fused_weight_3d: 0.5
  fused_weight_iou: 0.2
  fused_weight_appearance: 0.3
