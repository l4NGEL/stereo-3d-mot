%YAML:1.0
# Default pipeline configuration (parsed with cv::FileStorage).
# Override any field with:  --config path/to/other.yaml

stereo_matcher:
  # BM | SGBM
  type: "SGBM"
  min_disparity: 0
  num_disparities: 128        # must be a multiple of 16
  block_size: 5               # odd, 3..11 for SGBM
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  p1_multiplier: 8            # P1 = mult * channels * block_size^2
  p2_multiplier: 32           # P2 = mult * channels * block_size^2
  mode_hh: 0                  # 1 -> full-scale two-pass DP (slower, MODE_HH)

depth_eval:
  min_depth: 0.1
  max_depth: 100.0
  bad_thresholds: [1.0, 2.0, 4.0]   # disparity px error thresholds for bad-N%

tracking:
  dt: 0.1                     # seconds between frames (10 Hz)
  process_noise: 1.0          # accel std [m/s^2]
  measurement_noise: 0.05     # position std [m]
  max_age: 30                 # frames kept without a match before deletion
  min_hits: 3                 # matches before a track is confirmed
  gating_distance: 2.0        # max association distance [m]
