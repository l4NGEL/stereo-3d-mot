%YAML:1.0
# Phase 3 probe (docs/evaluation/REPORT.md remediation log): identical to
# ../kitti_tiled.yaml except mode_hh: 1 (SGBM's full-scale two-pass dynamic
# programming -- generally more accurate, slower). A single, well-established
# algorithmic option tested once against the untouched KITTI Stereo 2015
# ground truth, not a swept/tuned parameter -- see PROTOCOL.md's guarantee
# that this dataset is never used for tuning.
stereo_matcher:
  type: "SGBM"
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  p1_multiplier: 8
  p2_multiplier: 32
  mode_hh: 1
  num_tiles: 4

depth_eval:
  min_depth: 0.1
  max_depth: 100.0
  bad_thresholds: [1.0, 2.0, 4.0]

detector:
  type: "onnx"
  model_path: "models/yolov8n.onnx"
  score_threshold: 0.25
  nms_iou: 0.45
  input_size: 640
  keep_classes: [0, 1, 2, 3, 5, 7]

tracking:
  dt: 0.1
  process_noise: 1.0
  measurement_noise: 1.0
  max_age: 30
  min_hits: 3
  gating_distance: 2.0
  association: "mahalanobis3d"
  gating_chi2: 7.815
  iou_gate: 0.3
  use_hungarian: 1
  fused_weight_3d: 0.5
  fused_weight_iou: 0.2
  fused_weight_appearance: 0.3
