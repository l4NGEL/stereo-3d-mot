%YAML:1.0
# Recommended KITTI configuration: configs/kitti_tiled.yaml (tiled SGBM, YOLOv8n, score 0.25)
# plus the tracker selected by the ID-switch follow-up (docs/evaluation/IDSW_REPORT.md):
# association iou2d against the predicted 2D box, filtered box reported, E = 0 emission.
# kitti.yaml / kitti_tiled.yaml stay frozen for reproducing the published evaluation.
stereo_matcher:
  type: "SGBM"
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  p1_multiplier: 8
  p2_multiplier: 32
  mode_hh: 0
  # Sweet spot measured on KITTI's ~375-row images (docs/roadmap.md Phase 6):
  # 2.12x faster than num_tiles=1 at this tile count; num_tiles=8 is barely
  # faster and num_tiles=16 is net SLOWER, because a fixed overlap margin
  # competes directly with tile height once tiles get thin -- more tiles is
  # not free parallelism past this point on an image this short.
  num_tiles: 4

depth_eval:
  min_depth: 0.1
  max_depth: 100.0
  bad_thresholds: [1.0, 2.0, 4.0]

detector:
  type: "onnx"
  model_path: "models/yolov8n.onnx"
  score_threshold: 0.25
  nms_iou: 0.45
  input_size: 640
  keep_classes: [0, 1, 2, 3, 5, 7]

tracking:
  dt: 0.1
  process_noise: 1.0
  measurement_noise: 1.0
  max_age: 30
  min_hits: 3
  gating_distance: 2.0
  association: "iou2d"
  gating_chi2: 7.815
  iou_gate: 0.3
  use_hungarian: 1
  fused_weight_3d: 0.5
  fused_weight_iou: 0.2
  fused_weight_appearance: 0.3
  # Recommended tracker (docs/evaluation/IDSW_REPORT.md §10): IoU against the 2D box filter's
  # prediction, filtered box reported. Selected on 11 dev sequences, then confirmed once on the
  # 10 never-used KITTI sequences: IDF1 0.661 -> 0.706, IDSW 214 -> 115 vs the previous S*.
  # Emission stays E = 0 (isEmittable). Score threshold 0.25 / min_hits 3 as selected.
  iou_use_predicted_box: 1
  report_filtered_box: 1
  reconfirm_after_miss: 0
  sort_box_model: 0
  iou_max_total_assignment: 0
  box_coast_frames: 0
  sort_warmup: 0
