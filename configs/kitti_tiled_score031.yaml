%YAML:1.0
# Detection-only variant of kitti_tiled.yaml (kept SEPARATE, same convention as
# kitti_tiled.yaml itself vs kitti.yaml -- kitti_tiled.yaml's numbers are
# already published in docs/evaluation/results/tracking_{dev,test}.json and
# run_all.sh regenerates them from it; mutating it here would silently break
# that reproducibility). Phase 3 of the evaluation remediation
# (docs/evaluation/REPORT.md) selected score_threshold=0.31 on the 3 dev
# sequences only (smallest threshold satisfying Vehicle precision>=0.80 and
# recall>=0.70 simultaneously if one exists, else max dev F1 -- none did, so
# this is the max-F1 threshold) and verified it once on held-out data:
# Vehicle precision 0.788->0.851 (now clears the 0.80 target), recall
# 0.761->0.716 (still clears 0.70); Person precision 0.709->0.741 (still
# short of 0.75), recall 0.679->0.648 (still clears 0.50).
#
# This file is a DETECTION-ONLY recommendation. It has NOT been re-verified
# against tracking accuracy -- docs/evaluation/results/tracking_{dev,test}.json
# were measured with kitti_tiled.yaml's score_threshold=0.25, and raising it
# reduces the tracker's detection input, which Phase 1/2 never re-measured at
# this threshold. Use kitti_tiled.yaml for anything tracking-related.
stereo_matcher:
  type: "SGBM"
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  p1_multiplier: 8
  p2_multiplier: 32
  mode_hh: 0
  num_tiles: 4

depth_eval:
  min_depth: 0.1
  max_depth: 100.0
  bad_thresholds: [1.0, 2.0, 4.0]

detector:
  type: "onnx"
  model_path: "models/yolov8n.onnx"
  score_threshold: 0.31
  nms_iou: 0.45
  input_size: 640
  keep_classes: [0, 1, 2, 3, 5, 7]

tracking:
  dt: 0.1
  process_noise: 1.0
  measurement_noise: 1.0
  max_age: 30
  min_hits: 3
  gating_distance: 2.0
  association: "mahalanobis3d"
  gating_chi2: 7.815
  iou_gate: 0.3
  use_hungarian: 1
  fused_weight_3d: 0.5
  fused_weight_iou: 0.2
  fused_weight_appearance: 0.3
