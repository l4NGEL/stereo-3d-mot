%YAML:1.0
# KITTI tracking-benchmark evaluation config (see apps/benchmark_kitti.cpp).
#
# KITTI's label_02 only annotates road-scene categories (Car, Van, Truck,
# Pedestrian, Cyclist, Tram, ...); a stock COCO detector recognizes 80
# classes. MotAccumulator matches purely on 3D/2D position (class-agnostic),
# so every COCO detection with no KITTI counterpart nearby -- traffic light,
# stop sign, bench, backpack, ... -- scores as a pure false positive. This
# restricts the detector to the COCO classes that actually correspond to
# something KITTI labels; it does not attempt a precise class mapping (e.g.
# "Cyclist" is one fused KITTI object for what COCO sees as a separate
# person + bicycle) -- that mismatch is a known, documented limitation, not
# hidden by this filter.
stereo_matcher:
  type: "SGBM"
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  p1_multiplier: 8
  p2_multiplier: 32
  mode_hh: 0

depth_eval:
  min_depth: 0.1
  max_depth: 100.0
  bad_thresholds: [1.0, 2.0, 4.0]

detector:
  type: "onnx"
  model_path: "models/yolov8n.onnx"
  score_threshold: 0.25
  nms_iou: 0.45
  input_size: 640
  keep_classes: [0, 1, 2, 3, 5, 7]  # person, bicycle, car, motorcycle, bus, truck

tracking:
  dt: 0.1
  process_noise: 1.0
  # 0.05 m was tuned for the synthetic scene's small simulated jitter (see
  # benchmark_track); real SGBM stereo depth error on KITTI is far larger,
  # especially at range (error grows ~Z^2), so that default over-tightens
  # the Mahalanobis gate here and rejects genuinely-correct matches.
  measurement_noise: 1.0
  max_age: 30
  min_hits: 3
  gating_distance: 2.0
  association: "mahalanobis3d"
  gating_chi2: 7.815
  iou_gate: 0.3
  use_hungarian: 1
  # Phase 5 fused association (benchmark_kitti runs all three methods
  # regardless of `association` above -- these weights only affect the fused
  # one). Chosen by reasoning + the hand-verified unit tests in
  # test_tracker.cpp, NOT tuned against this sequence's real numbers -- see
  # docs/roadmap.md Phase 5.
  fused_weight_3d: 0.5
  fused_weight_iou: 0.2
  fused_weight_appearance: 0.3
